<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | 𝔸𝔹𝔻𝕆𝕌𝕌𝕌. ℍ𝕌𝕊𝕋𝔼ℕ𝔾. 𝕍ℙ𝕊</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
<style id="abdou-red-theme">
:root{color-scheme:dark;--accent:#ef233c;--accent2:#b90d20}
button,.btn-blue,.btn-dark,a[class*="bg-gradient-to-"]{
  border-radius:14px!important; transition:transform .2s ease,box-shadow .2s ease,filter .2s ease!important;
}
button[type="submit"],.btn-blue,a[class*="bg-gradient-to-"]{
  background:linear-gradient(135deg,#ff334d,#b90d20)!important;color:#fff!important;
  border:1px solid rgba(255,80,100,.65)!important;
  box-shadow:0 7px 22px rgba(239,35,60,.22);
}
button:hover,.btn-blue:hover,.btn-dark:hover{transform:translateY(-2px);filter:brightness(1.12);box-shadow:0 8px 24px rgba(239,35,60,.3)!important}
button:active,.btn-blue:active,.btn-dark:active{transform:scale(.97)}
input:focus,textarea:focus,select:focus{border-color:#ef233c!important;box-shadow:0 0 0 2px rgba(239,35,60,.18)!important;outline:none}
</style>
</head>
<body class="bg-[#0a0c12] min-h-screen flex items-center justify-center p-4">
    <div class="bg-[#12141c] rounded-2xl p-8 w-full max-w-md border border-red-500/30 shadow-2xl">
        <div class="text-center mb-8">
            <div class="w-20 h-20 bg-gradient-to-tr from-red-600 to-red-400 rounded-2xl flex items-center justify-center mx-auto mb-4">
                <i class="fas fa-cloud-upload-alt text-4xl text-white"></i>
            </div>
            <h1 class="text-3xl font-bold text-white">𝔸𝔹𝔻𝕆𝕌𝕌𝕌. ℍ𝕌𝕊𝕋𝔼ℕ𝔾. 𝕍ℙ𝕊</h1>
            <p class="text-gray-400 text-sm mt-1">Premium Hosting Solution</p>
        </div>
        
        {% if error %}
        <div class="bg-red-500/20 border border-red-500 rounded-lg p-3 mb-4 text-red-400 text-sm text-center">
            <i class="fas fa-exclamation-triangle mr-2"></i> {{ error }}
        </div>
        {% endif %}
        
        <form method="POST">
            <div class="mb-4">
                <label class="block text-gray-400 text-sm mb-2">Username</label>
                <input type="text" name="username" required 
                    class="w-full bg-[#0c0e14] border border-gray-700 rounded-lg px-4 py-3 text-white focus:border-red-500 focus:outline-none transition">
            </div>
            <div class="mb-6">
                <label class="block text-gray-400 text-sm mb-2">Password</label>
                <input type="password" name="password" required
                    class="w-full bg-[#0c0e14] border border-gray-700 rounded-lg px-4 py-3 text-white focus:border-red-500 focus:outline-none transition">
            </div>
            <button type="submit" 
                class="w-full bg-gradient-to-r from-red-600 to-red-500 hover:from-red-500 hover:to-red-600 text-white font-bold py-3 rounded-lg transition transform hover:scale-105">
                <i class="fas fa-sign-in-alt mr-2"></i> Login
            </button>
        </form>
        
        <div class="text-center mt-6">
            <p class="text-gray-600 text-xs">
                <i class="fas fa-shield-alt"></i> Secure Access Only
            </p>
        </div>
    </div>
</body>
</html>
